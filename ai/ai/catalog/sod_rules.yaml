# Правила несовместимости функций (segregation of duties) для поиска конфликта интересов.
# Правило срабатывает-кандидат, если одна структурная единица «после» покрывает обе категории;
# затем LLM проверяет по тексту, действительно ли совмещение есть, и даёт цитаты.
rules:
  # --- универсальные правила (COSO, разделение обязанностей) ---
  - id: SOD-G1
    name: Выбор поставщика и приёмка его товара
    categories: [procurement, receiving]
    severity: high
    rationale: >-
      Одна единица выбирает поставщика и согласует цену, а затем сама принимает его товар и подтверждает
      количество и качество. Это позволяет скрыть недопоставку, пересортицу или сговор с поставщиком — классический
      конфликт интересов в закупках.
  - id: SOD-G2
    name: Хранение ценностей и их инвентаризация
    categories: [warehousing, inventory_control]
    severity: high
    rationale: >-
      Материально ответственная единица сама пересчитывает свои остатки: недостачи может выявить только тот,
      кто за них отвечает.
  - id: SOD-G3
    name: Приём денег и их учёт/сверка
    categories: [cash_handling, finance_accounting]
    severity: high
    rationale: >-
      Единица, которая принимает денежные средства, сама ведёт их учёт или сверку — расхождения некому выявить.
  - id: SOD-G4
    name: Продажи и установление скидок
    categories: [sales, pricing]
    severity: medium
    rationale: >-
      Продавец сам назначает скидки на свои продажи: риск злоупотреблений ради выполнения плана или в пользу
      отдельных покупателей без независимого утверждения.

  # --- правила внутреннего аудита (IIA) ---
  - id: SOD-01
    name: Методология и контроль её качества
    categories: [methodology, quality_assurance]
    severity: medium
    rationale: >-
      Единица, которая разрабатывает методологию аудита, сама оценивает качество работ, выполненных по этой
      методологии. Оценка качества теряет независимость (IIA 1300: программа обеспечения качества должна быть объективной).
  - id: SOD-02
    name: Проведение проверок и контроль их качества
    categories: [audit_engagements, quality_assurance]
    severity: high
    rationale: >-
      Единица проверяет качество собственных аудиторских заданий — «проверяет сама себя».
  - id: SOD-03
    name: Консультирование и аудит той же области
    categories: [consulting, audit_engagements]
    severity: medium
    rationale: >-
      Аудитор оценивает процессы, в разработке которых сам участвовал как консультант
      (IIA 1130.A1 и 1130.C1: ограничение объективности).
  - id: SOD-04
    name: Согласование документов и их последующий аудит
    categories: [operational_approvals, audit_engagements]
    severity: high
    rationale: >-
      Согласование проектов документов, договоров и участие в управленческих решениях с последующей проверкой
      тех же операций — участие в операционной деятельности, несовместимое с независимостью аудита.
  - id: SOD-05
    name: Непрерывный мониторинг СВК и аудит СВК
    categories: [continuous_monitoring, audit_engagements]
    severity: low
    rationale: >-
      Если одна единица и выполняет контрольный мониторинг, и даёт аудиторскую оценку эффективности тех же
      контролей, оценка может оказаться необъективной.
