# Эталонный каталог функций — «общий язык» для сравнения редакций.
# Две части: универсальные функции любой организации и специализированные функции внутреннего аудита
# (разд. 2 Положения о ВА, стандарты IIA, Методические рекомендации Росимущества № 249).
# Функции «до» и «после» раскладываются по категориям; потеря = категория была покрыта единицей «до»,
# но не покрыта «после».
categories:
  # --- типовые обязанности руководителя (не участвуют в поиске потерь и дублей) ---
  - id: management
    name: Руководство и распределение обязанностей
    hint: >-
      организует работу своего подразделения, распределяет обязанности, проводит совещания, выполняет прочие
      поручения руководства, запрашивает информацию, взаимодействует с руководителями по общим вопросам
  - id: staff_development
    name: Развитие персонала
    hint: повышение квалификации, обучение, подбор, оценка работников подразделения

  # --- универсальные функции организации ---
  - id: sales
    name: Продажи и работа с заказами
    hint: приём и обработка заказов, консультирование покупателей, заключение договоров продажи
  - id: pricing
    name: Цены, скидки и акции
    hint: установление цен, скидок, акций, промо-условий и их утверждение
  - id: marketing
    name: Маркетинг и продвижение
    hint: реклама, соцсети, продвижение бренда, маркетинговые исследования
  - id: procurement
    name: Закупки и работа с поставщиками
    hint: выбор поставщиков, согласование цен закупки, размещение заказов поставщикам, договоры поставки
  - id: receiving
    name: Приёмка и входной контроль
    hint: приёмка товаров/работ от поставщиков, проверка количества и качества, подписание накладных и актов
  - id: warehousing
    name: Хранение и складские операции
    hint: хранение товаров и материальных ценностей, обеспечение сохранности, комплектация и отгрузка
  - id: inventory_control
    name: Инвентаризация и учёт остатков
    hint: инвентаризация, пересчёт остатков, выявление недостач и излишков, сверка фактических и учётных данных
  - id: logistics
    name: Доставка и логистика
    hint: доставка, маршрутизация, транспорт, диспетчеризация
  - id: cash_handling
    name: Работа с денежными средствами
    hint: приём наличных и безналичных оплат, инкассация, сдача выручки, проведение платежей
  - id: finance_accounting
    name: Финансы, учёт и отчётность
    hint: бухгалтерский учёт, сверка расчётов, финансовая отчётность, бюджетирование
  - id: customer_service
    name: Обслуживание клиентов и претензии
    hint: обращения клиентов, жалобы, претензии, возвраты и обмены
  - id: demand_assortment
    name: Анализ спроса и ассортимент
    hint: анализ спроса, формирование ассортимента, прогнозирование продаж
  - id: it_systems
    name: ИТ и информационные системы
    hint: сопровождение информационных систем, сайта, инфраструктуры, информационная безопасность
  - id: legal_compliance
    name: Правовое обеспечение и комплаенс
    hint: юридическая экспертиза, договорная работа, соответствие законодательству

  # --- функции внутреннего аудита ---
  - id: planning
    name: Планирование аудита
    hint: риск-ориентированный план работ, приоритеты, согласование и актуализация плана
  - id: audit_engagements
    name: Проведение аудиторских проверок
    hint: плановые и внеплановые проверки, операционный и финансовый аудит, аудиторские задания, программы проверок
  - id: it_audit
    name: ИТ-аудит и анализ данных
    hint: аудит информационных систем и ИТ-процессов, аналитика данных, автоматизированные аудиторские процедуры
  - id: continuous_monitoring
    name: Непрерывный мониторинг СВК
    hint: непрерывный аудит/мониторинг контрольных процедур, индикаторы, тестирование СВК на постоянной основе
  - id: risk_governance_assessment
    name: Оценка СУР и корпоративного управления
    hint: оценка эффективности системы управления рисками и корпоративного управления
  - id: quality_assurance
    name: Контроль качества аудита
    hint: программа обеспечения и повышения качества, внутренние и внешние оценки качества, проверка рабочих документов
  - id: methodology
    name: Методология и ВНД внутреннего аудита
    hint: разработка и актуализация методологии, стандартов, регламентов, внутренних нормативных документов ВА
  - id: consulting
    name: Консультирование руководства
    hint: консультационные услуги, содействие в разработке процедур и мероприятий, ответы на запросы руководства
  - id: operational_approvals
    name: Согласование документов и участие в управленческих решениях
    hint: согласование проектов документов и договоров, участие в комиссиях и рабочих группах, принятие решений
  - id: followup
    name: Мониторинг выполнения рекомендаций
    hint: контроль исполнения планов мероприятий по устранению недостатков, последующий контроль
  - id: investigations
    name: Расследования и горячая линия
    hint: расследование недобросовестных действий, обращения на горячую линию, противодействие мошенничеству и коррупции
  - id: reporting
    name: Отчётность перед СД и Комитетом по аудиту
    hint: отчёты о деятельности, информирование Совета директоров, Комитета по аудиту, Президента
  - id: external_coordination
    name: Взаимодействие с внешним аудитором и регуляторами
    hint: координация с внешним аудитором, надзорными органами, другими субъектами СВК
  - id: subsidiaries
    name: Внутренний аудит ДЗО
    hint: функциональное руководство и координация внутреннего аудита дочерних и зависимых обществ
  - id: other
    name: Прочее
    hint: функции, не подходящие ни под одну категорию
